<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Harshita!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #0b0b1a; font-family: system-ui, sans-serif; }
    
    /* Fullscreen frame to load your scenes seamlessly */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Beautiful entry overlay to bypass browser audio block policies gracefully */
    #audio-gate {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0d0d26 0%, #1a1a4e 40%, #4b1f7a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #fff;
      transition: opacity 0.8s ease;
    }

    .gate-card {
      text-align: center;
      padding: 40px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      max-width: 90%;
      width: 440px;
    }

    h1 { 
      font-size: 26px; 
      line-height: 1.4;
      font-weight: 600; 
      margin-bottom: 24px;
      background: linear-gradient(45deg, #ffd080, #ff7597);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gate-btn {
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff7597, #ff4e79);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 117, 151, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .gate-btn:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 117, 151, 0.6);
    }
    .gate-btn:active {
      transform: scale(0.98) translateY(0);
    }
  </style>
</head>
<body>

  <div id="audio-gate">
    <div class="gate-card">
      <h1>A special story made just for you... ❤️</h1>
      <button class="gate-btn" onclick="startEverything()">Open Story ✨</button>
    </div>
  </div>

  <audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <iframe id="story-frame" src="index.html"></iframe>

  <script>
    function startEverything() {
      const music = document.getElementById('bg-music');
      const gate = document.getElementById('audio-gate');
      
      // Forces music to trigger playback on explicit click
      music.play().catch(err => console.log("Audio playback was blocked: ", err));
      
      // Animate entry curtain away
      gate.style.opacity = '0';
      setTimeout(() => {
        gate.style.display = 'none';
      }, 800);
    }
  </script>
</body>
</html>
