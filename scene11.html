<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Scene 12 - Diwali Night Ending</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at bottom, #050014, #12002b, #000);
    font-family: sans-serif;
  }

  .scene {
    width: 100%;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 2;
  }

  /* 🎆 FIREWORKS CANVAS LAYER */
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 0;
  }

  /* 🌻 SUNFLOWER */
  .sunflower {
    width: 180px;
    height: 180px;
    opacity: 0;
    transform: scale(0.5);
    transition: 2s ease;
    z-index: 3;
  }

  .sunflower.show {
    opacity: 1;
    transform: scale(1);
  }

  /* 🌟 GLOW */
  .glow {
    position: absolute;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(255,255,120,0.25), transparent 70%);
    border-radius: 50%;
    animation: pulse 3s infinite;
    z-index: 2;
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 1; }
  }

  /* 💛 TEXT */
  .final-text {
    margin-top: 25px;
    text-align: center;
    color: white;
    font-size: 22px;
    opacity: 0;
    transform: translateY(20px);
    transition: 2s ease;
    text-shadow: 0 0 10px rgba(0,0,0,0.6);
    z-index: 3;
  }

  .final-text.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>

<body>

<!-- 🎆 FIREWORKS CANVAS -->
<canvas id="fireworks"></canvas>

<div class="scene">

  <div class="glow"></div>

  <!-- 🌻 SUNFLOWER -->
  <svg class="sunflower" id="flower" viewBox="0 0 200 200">

    <g fill="#ffcc00">
      <ellipse cx="100" cy="30" rx="12" ry="30"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(30 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(60 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(90 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(120 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(150 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(180 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(210 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(240 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(270 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(300 100 100)"/>
      <ellipse cx="100" cy="30" rx="12" ry="30" transform="rotate(330 100 100)"/>
    </g>

    <circle cx="100" cy="100" r="35" fill="#3b2a14"/>
  </svg>

  <!-- 💛 TEXT -->
  <div class="final-text" id="text">
    🌻 Even after the celebration ends...<br>
    you remain my brightest light, Harshita 💛🌻<br>
    Once again a Happiest Birthday I wanna Capture this Smile of Urs for Forever ✨🕯️✨❤️
  </div>

</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function Firework(x, y) {
  this.x = x;
  this.y = y;
  this.colors = ["#ff0","#f0f","#0ff","#ff4d4d","#4dff88"];

  this.parts = [];

  for (let i = 0; i < 40; i++) {
    this.parts.push({
      x: x,
      y: y,
      angle: Math.random() * 2 * Math.PI,
      speed: Math.random() * 4 + 2,
      color: this.colors[Math.floor(Math.random() * this.colors.length)],
      alpha: 1
    });
  }
}

Firework.prototype.update = function() {
  this.parts.forEach(p => {
    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;
    p.alpha -= 0.02;
  });
};

Firework.prototype.draw = function() {
  this.parts.forEach(p => {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
  });
};

function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (Math.random() < 0.04) {
    particles.push(new Firework(
      Math.random() * canvas.width,
      Math.random() * canvas.height * 0.6
    ));
  }

  particles.forEach((f, i) => {
    f.update();
    f.draw();

    if (f.parts[0].alpha <= 0) {
      particles.splice(i, 1);
    }
  });

  requestAnimationFrame(animate);
}

window.onload = () => {

  const flower = document.getElementById("flower");
  const text = document.getElementById("text");

  setTimeout(() => flower.classList.add("show"), 800);
  setTimeout(() => text.classList.add("show"), 2000);

  animate();
};
</script>

</body>
</html>
