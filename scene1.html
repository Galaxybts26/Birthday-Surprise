<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Adventure</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(
135deg,
#ffeaa7,
#fdcb6e,
#fab1a0,
#ffdde1
);
position:relative;
}

/* Floating flowers */

.flower{
position:absolute;
font-size:30px;
animation:float 8s linear infinite;
opacity:.8;
}

@keyframes float{
0%{
transform:translateY(110vh) rotate(0deg);
}
100%{
transform:translateY(-20vh) rotate(360deg);
}
}

/* Main Card */

.card{
width:90%;
max-width:500px;
padding:40px;
border-radius:25px;

background:rgba(255,255,255,.2);
backdrop-filter:blur(20px);

text-align:center;

box-shadow:
0 8px 32px rgba(0,0,0,.15);

animation:appear 1.2s ease;
}

@keyframes appear{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

h1{
color:#fff;
font-size:2.3rem;
margin-bottom:15px;
}

p{
color:white;
margin-bottom:20px;
font-size:1.1rem;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
outline:none;
text-align:center;
margin-bottom:15px;
}

button{
padding:14px 28px;
border:none;
border-radius:50px;
background:#ff7675;
color:white;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.message{
margin-top:20px;
color:white;
font-weight:bold;
min-height:40px;
}

.sparkle{
position:absolute;
font-size:25px;
animation:spark 1.5s forwards;
pointer-events:none;
}

@keyframes spark{
0%{
opacity:1;
transform:scale(.2);
}
100%{
opacity:0;
transform:scale(2.5);
}
}

</style>
</head>

<body>

<div class="card">

<h1>✨ Secret Birthday Portal ✨</h1>

<p>
Only the birthday girl can unlock the surprise...
</p>

<input
id="nameInput"
placeholder="Enter your name"
/>

<button onclick="checkName()">
Unlock 🔐
</button>

<div class="message" id="msg"></div>

</div>

<script>

// create floating flowers

for(let i=0;i<25;i++){

let flower=document.createElement("div");

flower.className="flower";

flower.innerHTML=
Math.random()>.5
?"🌻"
:"✨";

flower.style.left=
Math.random()*100+"vw";

flower.style.animationDuration=
(5+Math.random()*8)+"s";

flower.style.fontSize=
(20+Math.random()*30)+"px";

document.body.appendChild(flower);
}

const funnyResponses=[
"🤨 Nice try...",
"😂 That's not the birthday girl.",
"🌻 Access denied.",
"🙈 Almost... but not quite.",
"🎂 This surprise belongs to someone special."
];

function checkName(){

let name=
document
.getElementById("nameInput")
.value
.trim()
.toLowerCase();

let msg=
document.getElementById("msg");

if(name==="harshita"){

msg.innerHTML=
"✨ Access Granted, Harshita! Oops Miss Lightiee ✨";

createSparkles();

setTimeout(() => {
  sessionStorage.setItem("user", name);
  window.location.href = "scene2.html";
}, 1500);
}
else{

msg.innerHTML=
funnyResponses[
Math.floor(
Math.random()*funnyResponses.length
)
];

}
}

function createSparkles(){

for(let i=0;i<80;i++){

let s=document.createElement("div");

s.className="sparkle";

s.innerHTML=
Math.random()>.5
?"✨"
:"🌻";

s.style.left=
Math.random()*100+"vw";

s.style.top=
Math.random()*100+"vh";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},1500);
}
}

</script>

</body>
</html>
